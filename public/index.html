function forwardMessage(id){const m=msgData.get(id);if(!m||!m.text)return;const destinations=chatCache.filter(c=>c.id!==activeChat?.id&&!bg5Archived().has(c.id));modal(`<h3>➦ Переслать сообщение</h3><p class="hint">Выбери чат, куда отправить текст</p>${destinations.length?destinations.map(c=>{const meta=chatMeta(c);return `<button class="person" data-forward-to="${safe(c.id)}" style="width:100%;text-align:left">${safe(meta.title)}<small>${safe(c.kind==='group'?'Группа':c.kind==='channel'?'Канал':'Личный чат')}</small></button>`}).join(''):'<p class="hint">Нет других чатов для пересылки</p>'}`);document.querySelectorAll('[data-forward-to]').forEach(b=>b.onclick=async()=>{try{await sendMsgDoc(b.dataset.forwardTo,{text:String(m.text).slice(0,4000),senderId:currentUser.uid,senderName:profile?.name||currentUser.displayName||'Пользователь',forwardedFrom:{name:m.senderName||'Пользователь'},createdAt:serverTimestamp()});closeModal();alert('Сообщение переслано')}catch(e){alert('Не удалось переслать: '+e.message)}})}

function deleteMessage(id){modal(`<h3>Удалить сообщение?</h3><p class="hint">Сообщение будет удалено из чата для всех участников.</p><button type="button" class="danger" id="confirmDel">Удалить</button>`);
 $('confirmDel').onclick=async()=>{try{await deleteDoc(doc(db,'chats',activeChat.id,'messages',id));refreshPreview(activeChat.id);closeModal()}catch(er){alert('Не удалось удалить сообщение: '+er.message)}}}

 try{await sendMsgDoc(activeChat.id,data);stopTyping();$('message').value='';try{localStorage.removeItem('blackgram-draft-v1:'+currentUser.uid+':'+activeChat.id)}catch(e){}setReply(null)}catch(er){alert('Не удалось отправить сообщение: '+er.message)}finally{$('sendBtn').disabled=false}};

function watchChats(){notifyReady=false;if(stopChatList)stopChatList();stopChatList=onSnapshot(query(collection(db,'chats'),where('participants','array-contains',currentUser.uid)),s=>{notifyChanges(s);chatCache=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));if(activeChat)markRead(activeChat.id);if(listMode==='chats')renderChats()},er=>{console.error(er);if(listMode==='chats')$('people').innerHTML='<div class="empty">Не удалось загрузить чаты. Проверь правила Firestore.</div>'})}
const chatTime=c=>c.lastAt?.toMillis?.()||c.createdAt?.toMillis?.()||0;
function fmtChatTime(c){const ms=chatTime(c);if(!ms)return'';const d=new Date(ms),now=new Date();return d.toDateString()===now.toDateString()?d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}
function chatMeta(c){const me=currentUser.uid;let title=c.title||'Чат',otherId=null,photo='';if(c.kind==='personal'){otherId=(c.participants||[]).find(x=>x!==me)||null;const u=allUsers.find(x=>x.id===otherId);title=u?.name||u?.email||(c.createdBy===me?c.title:'Пользователь');photo=u?.photoURL||''}else if(c.kind==='saved')title='★ Избранное';else if(c.kind==='channel')title='📢 '+title;
 return{title,otherId,photo,initial:c.kind==='saved'?'★':(String(title).replace(/^📢\s*/,'').trim().slice(0,1).toUpperCase()||'?')}}

function pinnedChatIds(){try{const v=JSON.parse(localStorage.getItem('blackgram-pinned-v1:'+currentUser.uid)||'[]');return Array.isArray(v)?v.filter(x=>typeof x==='string'):[]}catch(e){return[]}}
function savePinnedChatIds(ids){try{localStorage.setItem('blackgram-pinned-v1:'+currentUser.uid,JSON.stringify([...new Set(ids)]))}catch(e){console.warn('Не удалось сохранить закрепления',e)}}
function togglePinnedChat(id){const ids=pinnedChatIds(),has=ids.includes(id);savePinnedChatIds(has?ids.filter(x=>x!==id):[id,...ids]);renderChats()}
function openChatFromList(c,meta){markRead(c.id);openChat({id:c.id,title:meta.title,kind:c.kind,otherId:meta.otherId,participants:c.participants});renderPeople()}
function renderChats(){const host=$('people'),f=$('search').value.trim().toLowerCase(),pins=new Set(pinnedChatIds());const arr=chatCache.map(c=>({c,meta:chatMeta(c)})).filter(x=>!f||x.meta.title.toLowerCase().includes(f)||String(x.c.lastText||'').toLowerCase().includes(f)).sort((a,b)=>Number(pins.has(b.c.id))-Number(pins.has(a.c.id))||chatTime(b.c)-chatTime(a.c));host.innerHTML='';
 if(!arr.length){host.innerHTML='<div class="empty">'+(f?'Ничего не найдено':'Чатов пока нет. Открой вкладку «Люди» и начни переписку.')+'</div>';return}
 arr.forEach(({c,meta})=>{const b=document.createElement('div'),prev=c.lastText?(c.lastSenderId===currentUser.uid?'Ты: ':'')+c.lastText:'Нет сообщений',pinned=pins.has(c.id);b.className='person'+(activeChat?.id===c.id?' active':'');b.setAttribute('role','button');b.setAttribute('tabindex','0');
  if(meta.photo){const im=document.createElement('img');im.className='avatar';im.src=meta.photo;im.alt='';im.loading='lazy';b.append(im)}else{const av=document.createElement('span');av.className='avatar';av.textContent=meta.initial;b.append(av)}
  const info=document.createElement('span');info.className='person-meta';const line=document.createElement('span');line.className='person-name chatrow';const name=document.createElement('span');name.className='chatname';name.textContent=meta.title;const time=document.createElement('time');time.className='chattime';time.textContent=fmtChatTime(c);line.append(name,time);const preview=document.createElement('small');preview.textContent=prev;info.append(line,preview);b.append(info);
  if(isUnread(c)){const dot=document.createElement('i');dot.className='unread-dot';dot.title='Новое';b.append(dot)}
  const pin=document.createElement('button');pin.type='button';pin.className='chat-pin'+(pinned?' pinned':'');pin.textContent='📌';pin.title=pinned?'Открепить чат':'Закрепить чат';pin.setAttribute('aria-label',pin.title);pin.setAttribute('aria-pressed',String(pinned));pin.onclick=e=>{e.stopPropagation();togglePinnedChat(c.id)};b.append(pin);
  b.onclick=()=>openChatFromList(c,meta);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openChatFromList(c,meta)}};host.appendChild(b)})}

const bg5Key=(name)=>'blackgram5:'+name+':'+(currentUser?.uid||'guest');

function bg5EditProfile(p={}){modal(`<h3>✎ Редактировать профиль</h3><div class="profile-edit-grid"><label>Имя<input id="editName" maxlength="40" value="${safe(p.name||currentUser.displayName||'')}"></label><label>О себе<textarea id="editAbout" maxlength="300" rows="3">${safe(p.about||p.bio||'')}</textarea></label><label>Статус<input id="editStatus" maxlength="80" value="${safe(p.status||'')}"></label><label>Ссылка на аватар (HTTPS)<input id="editAvatar" value="${safe(p.photoURL||'')}" placeholder="https://..."></label><label>День рождения<input id="editBirthday" maxlength="40" value="${safe(p.birthday||'')}" placeholder="Например, 09 сентября"></label><label>Адрес<input id="editAddress" maxlength="100" value="${safe(p.address||'')}" placeholder="Город, страна"></label><label>Часы работы<input id="editHours" maxlength="60" value="${safe(p.hours||'')}" placeholder="Круглосуточно"></label><label>Музыка<input id="editMusic" maxlength="100" value="${safe(p.music||'')}" placeholder="Исполнитель — песня"></label></div><button id="saveProfile" style="width:100%;margin-top:14px">Сохранить профиль</button>`);$('saveProfile').onclick=async()=>{let name=$('editName').value.trim(),status=$('editStatus').value.trim(),photoURL=$('editAvatar').value.trim(),about=$('editAbout').value.trim(),birthday=$('editBirthday').value.trim(),address=$('editAddress').value.trim(),hours=$('editHours').value.trim(),music=$('editMusic').value.trim();if(name.length<2)return alert('Имя должно быть не короче 2 символов');if(photoURL&&!/^https:\/\//i.test(photoURL))return alert('Ссылка на аватар должна начинаться с https://');try{const patch={name,status,photoURL,about,birthday,address,hours,music};await setDoc(doc(db,'users',currentUser.uid),patch,{merge:true});await updateProfile(currentUser,{displayName:name,photoURL:photoURL||null});profile={...profile,...patch};$('me').innerHTML=(photoURL?`<img class="avatar" src="${safe(photoURL)}" alt="">`:'')+'Ты: '+safe(name)+(status?' · '+safe(status):'');re function bg5StickerPicker(){if(!bg5NeedUser())return;const stickers=bg5Stickers();modal(`<h3>🧩 Мои стикеры</h3><p class="hint">Нажми на стикер, чтобы сразу отправить его в открытый чат. Коллекция хранится на этом устройстве.</p><div class="bg5-stickers">${stickers.map((x,i)=>`<button class="bg5-sticker" data-sticker="${i}" type="button">${safe(x.emoji)}<small>${safe(x.name)}</small></button>`).join('')}</div><div class="stack"><button id="bg5MakeSticker" class="secondary">＋ Создать свой стикер</button><button id="bg5StickerPack" class="secondary">＋ Добавить набор</button></div>`);document.querySelectorAll('[data-sticker]').forEach(b=>b.onclick=async()=>{const x=stickers[Number(b.dataset.sticker)];if(!activeChat)return alert('Сначала открой чат');try{await sendMsgDoc(activeChat.id,{text:x.emoji,sticker:true,stickerName:x.name,senderId:currentUser.uid,senderName:profile?.name||currentUser.displayName||'Пользователь',createdAt:serverTimestamp()});closeModal()}catch(e){alert('Не удалось отправить стикер: '+e.message)}});$('bg5MakeSticker').onclick=()=>bg5StickerCreate();$('bg5StickerPack').onclick=()=>bg5StickerCreate(true)}
function bg5StickerCreate(pack=false){modal(`<h3>${pack?'＋ Новый набор стикеров':'＋ Создать стикер'}</h3><div class="stack"><label>${pack?'Название набора':'Название стикера'}<input id="bg5StickerName" maxlength="28" placeholder="Например, Мои эмоции"></label><label>Эмодзи / символ<input id="bg5StickerEmoji" maxlength="8" value="😎" placeholder="😎"></label><button id="bg5StickerSave">Сохранить</button></div><p class="hint">Сейчас редактор создаёт стикеры на основе эмодзи. Загрузка PNG/WebP и анимация будут отдельным расширением.</p>`);$('bg5StickerSave').onclick=()=>{const name=$('bg5StickerName').value.trim()||'Мой стикер',emoji=$('bg5StickerEmoji').value.trim();if(!emoji)return alert('Введи эмодзи');const arr=bg5Stickers();arr.push({name,emoji});bg5Write('stickers',arr);bg5StickerPicker()}}
function bg5Catalog(){if(!bg5NeedUser())return;const channels=chatCache.filter(c=>c.kind==='channel');const stickers=bg5Stickers();modal(`<h3>🛍 Каталог Blackgram</h3><p class="hint">Твои доступные каналы и личная коллекция стикеров.</p><h4>📢 Каналы</h4>${channels.length?channels.map(c=>`<div class="bg5-item"><span>${safe(c.title||'Канал')}</span><button data-open-channel="${safe(c.id)}">Открыть</button></div>`).join(''):'<p class="hint">Пока нет каналов. Создай свой канал или попроси приглашение.</p>'}<button id="bg5CreateChannel" class="secondary" style="width:100%;margin-top:8px">＋ Создать канал</button><h4>🧩 Стикеры (${stickers.length})</h4><div class="bg5-stickers">${stickers.slice(0,12).map(x=>`<div class="bg5-sticker">${safe(x.emoji)}<small>${safe(x.name)}</small></div>`).join('')}</div><button id="bg5OpenStickers" class="secondary" style="width:100%">Открыть стикеры</button><h4>🖼 Аватар</h4><p class="hint">Загрузи собственную фотографию профиля прямо с телефона.</p><input id="bg5AvatarFile" type="file" accept="image/png,image/jpeg,image/webp" style="width:100%;margin:8px 0"><button id="bg5UploadAvatar" class="secondary" style="width:100%">Загрузить аватар</button>`);document.querySelectorAll('[data-open-channel]').forEach(b=>b.onclick=()=>{const c=chatCache.find(x=>x.id===b.dataset.openChannel);if(c){const title=c.title||'Канал';closeModal();openChat({id:c.id,title,kind:'channel',participants:c.participants||[]})}});$('bg5CreateChannel').onclick=()=>{$('channelBtn').click()};$('bg5OpenStickers').onclick=bg5StickerPicker;$('bg5UploadAvatar').onclick=async()=>{const file=$('bg5AvatarFile').files[0];if(!file)return alert('Выбери изображение');if(!file.type.startsWith('image/'))return alert('Нужен файл изображения');if(file.size>5*1024*1024)return alert('Максимальный размер аватара — 5 МБ');const btn=$('bg5UploadAvatar');btn.disabled=true;btn.textContent='Загрузка…';try{const task=await uploadBytesResumable(sref(storage,'avatars/'+currentUser.uid+'/avatar_'+Date.now()),file,{contentType:file.type});const url=await getDownloadURL(task.ref);await updateDoc(doc(db,'users',currentUser.uid),{photoURL:url});await updateProfile(currentUser,{photoURL:url});profile={...profile,photoURL:url};$('me').innerHTML='<img class="avatar" src="'+safe(url)+'" alt=""> Ты: '+safe(profile.name||currentUser.email);btn.textContent='Аватар обновлён';}catch(e){alert('Не удалось загрузить аватар: '+e.message);btn.disabled=false;btn.textContent='Загрузить аватар'}}}
function bg5Archive(){if(!bg5NeedUser())return;const ids=bg5Archived(),items=chatCache.filter(c=>ids.has(c.id));modal(`<h3>🗃 Архив чатов</h3>${items.length?items.map(c=>{let other=(c.participants||[]).find(x=>x!==currentUser.uid),u=allUsers.find(x=>x.id===other);let title=c.kind==='personal'?(u?.name||u?.email||'Личный чат'):(c.title||'Группа');return `<div class="bg5-item"><span>${safe(title)}</span><button data-unarchive="${safe(c.id)}">Вернуть</button></div>`}).join(''):'<p class="hint">Архив пуст. Открой настройки нужного чата и выбери «В архив».</p>'}`);document.querySelectorAll('[data-unarchive]').forEach(b=>b.onclick=()=>{bg5Write('archivedChats',[...bg5Archived()].filter(x=>x!==b.dataset.unarchive));bg5Archive();renderPeople()})}
function bg5Username(){if(!bg5NeedUser())return;const name=profile?.username||'';modal(`<h3>@ Username</h3><p class="hint">Уникальное имя для поиска и ссылки на профиль. Используй 4–24 символа: латинские буквы, цифры и подчёркивание.</p><div class="stack"><label>Твой username<input id="bg5UsernameValue" maxlength="24" value="${safe(name)}" placeholder="my_name"></label><button id="bg5SaveUsername">Сохранить username</button><p id="bg5UsernameStatus" class="hint"></p></div>`);$('bg5SaveUsername').onclick=async()=>{let raw=$('bg5UsernameValue').value.trim().replace(/^@/,'').toLowerCase(),status=$('bg5UsernameStatus');if(!/^[a-z0-9_]{4,24}$/.test(raw)){status.textContent='Нужно 4–24 символа: a-z, 0-9 или _';return}status.textContent='Проверяю доступность…';$('bg5SaveUsername').disabled=true;try{const q=await getDocs(query(collection(db,'users'),where('usernameLower','==',raw),limit(2)));if(q.docs.some(d=>d.id!==currentUser.uid)){status.textContent='Это имя уже занято';return}await updateDoc(doc(db,'users',currentUser.uid),{username:raw,usernameLower:raw});profile={...profile,username:raw,usernameLower:raw};status.textContent='Сохранено: @'+raw; $('me').innerHTML='Ты: '+safe(profile.name||currentUser.email)+' · @'+safe(raw)+' '+userBadges({...profile,email:currentUser.email})}catch(e){status.textContent='Не удалось сохранить: '+e.message}finally{$('bg5SaveUsername').disabled=false}}}
function bg5Blocklist(){if(!bg5NeedUser())return;const ids=bg5Blocked();const users=allUsers.filter(u=>ids.has(u.id));modal(`<h3>🚫 Чёрный список</h3><p class="hint">Заблокированные здесь пользователи скрываются из твоего списка людей и чатов на этом устройстве. Это пока локальная настройка, не глобальный бан аккаунта.</p>${users.length?users.map(u=>`<div class="bg5-item"><span>${safe(u.name||u.email||'Пользователь')}</span><button data-unblock="${safe(u.id)}">Разблокировать</button></div>`).join(''):'<p class="hint">Здесь пока никого нет. Заблокировать собеседника можно в настройках чата.</p>'}`);document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=()=>{bg5Write('blockedUsers',[...bg5Blocked()].filter(x=>x!==b.dataset.unblock));bg5Blocklist();renderPeople()})}
function bg5ChatSettings(){if(!bg5NeedUser()||!activeChat)return alert('Сначала открой чат');const prefs=bg5ChatPrefs(),p=prefs[activeChat.id]||{},isBlocked=activeChat.otherId&&bg5Blocked().has(activeChat.otherId),archived=bg5Archived().has(activeChat.id);modal(`<h3>⚙ Настройки чата</h3><p class="hint">${safe(activeChat.title||'Чат')}</p><div class="stack"><label class="bg5-item"><span>🔕 Не беспокоить</span><input id="bg5Mute" type="checkbox" ${p.muted?'checked':''} style="width:20px"></label><label class="bg5-item"><span>📌 Закрепить чат</span><input id="bg5Pin" type="checkbox" ${p.pinned?'checked':''} style="width:20px"></label><label class="bg5-item"><span>🗃 В архиве</span><input id="bg5ArchiveToggle" type="checkbox" ${archived?'checked':''} style="width:20px"></label><label>Цвет фона чата<select id="bg5ChatColor" style="width:100%;padding:11px;border-radius:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line)"><option value="">По умолчанию</option><option value="#101c2b" ${p.color==='#101c2b'?'selected':''}>Ночной синий</option><option value="#17251f" ${p.color==='#17251f'?'selected':''}>Тёмно-зелёный</option><option value="#21172e" ${p.color==='#21172e'?'selected':''}>Фиолетовый</option></select></label><button id="bg5SaveChatPrefs">Сохранить настройки</button>${activeChat.kind==='personal'?`<button id="bg5ToggleBlock" class="danger">${isBlocked?'Разблокировать пользователя':'🚫 Заблокировать пользователя'}</button>`:''}</div>`);$('bg5SaveChatPrefs').onclick=()=>{const all=bg5ChatPrefs();all[activeChat.id]={muted:$('bg5Mute').checked,pinned:$('bg5Pin').checked,color:$('bg5ChatColor').value};bg5Write('chatPrefs',all);const ids=bg5Archived();if($('bg5ArchiveToggle').checked)ids.add(activeChat.id);else ids.delete(activeChat.id);bg5Write('archivedChats',[...ids]);if($('bg5Pin').checked&&!pinnedChatIds().includes(activeChat.id))togglePinnedChat(activeChat.id);else if(!$('bg5Pin').checked&&pinnedChatIds().includes(activeChat.id))togglePinnedChat(activeChat.id);document.querySelector('.chat').style.background=$('bg5ChatColor').value||'';closeModal();renderPeople()};if($('bg5ToggleBlock'))$('bg5ToggleBlock').onclick=()=>{const ids=bg5Blocked();if(ids.has(activeChat.otherId))ids.delete(activeChat.otherId);else ids.add(activeChat.otherId);bg5Write('blockedUsers',[...ids]);closeModal();renderPeople();alert(ids.has(activeChat.otherId)?'Пользователь скрыт из твоих списков':'Пользователь разблокирован')}}
function bg5Support(){if(!bg5NeedUser())return;const admin=isOwner()||hasPermission('manageSupport');modal(`<h3>🛟 Служба поддержки</h3><p class="hint">Опиши проблему. Обращение сохранится в Firebase, чтобы его могла увидеть команда поддержки.</p><div class="stack"><label>Тема<select id="bg5TicketTopic" style="width:100%;padding:11px;border-radius:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line)"><option>Проблема с аккаунтом</option><option>Не отправляются сообщения</option><option>Звонки и видео</option><option>Жалоба или безопасность</option><option>Предложение</option><option>Другое</option></select></label><label>Сообщение<textarea id="bg5TicketText" maxlength="2000" rows="4" placeholder="Расскажи, что случилось…" style="width:100%;padding:12px;border-radius:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line)"></textarea></label><button id="bg5SendTicket">Отправить обращение</button>${admin?'<button id="bg5SupportInbox" class="secondary">📥 Входящие обращения (админ)</button>':''}</div>`);$('bg5SendTicket').onclick=async()=>{const message=$('bg5TicketText').value.trim(),topic=$('bg5TicketTopic').value;if(message.length<8)return alert('Напиши подробнее (минимум 8 символов)');$('bg5SendTicket').disabled=true;try{const r=await addDoc(collection(db,'supportTickets'),{by:currentUser.uid,byEmail:currentUser.email||'',byName:profile?.name||'Пользователь',topic,message:message.slice(0,2000),status:'open',createdAt:serverTimestamp()});modal(`<h3>✅ Обращение отправлено</h3><p>Номер заявки: <b>${safe(r.id)}</b></p><p class="hint">Команда поддержки сможет найти его в панели обращений.</p>`)}catch(e){$('bg5SendTicket').disabled=false;alert('Не удалось отправить обращение. Проверь правила Firestore: '+e.message)}};if($('bg5SupportInbox'))$('bg5SupportInbox').onclick=async()=>{try{const snap=await getDocs(query(collection(db,'supportTickets'),orderBy('createdAt','desc'),limit(50)));modal(`<h3>📥 Обращения поддержки</h3>${snap.empty?'<p class="hint">Новых обращений пока нет.</p>':snap.docs.map(d=>{const x=d.data();return `<div class="bg5-item"><span><b>${safe(x.topic||'Обращение')}</b><small style="display:block;color:var(--muted)">${safe(x.byName||x.byEmail||'Пользователь')} · ${safe(x.status||'open')}<br>${safe(x.message||'')}</small></span><button data-ticket="${safe(d.id)}">Закрыть</button></div>`}).join('')}`);document.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,'supportTickets',b.dataset.ticket),{status:'closed',closedAt:serverTimestamp(),closedBy:currentUser.uid});b.textContent='Закрыто';b.disabled=true}catch(e){alert('Не удалось закрыть: '+e.message)}})}catch(e){alert('Не удалось загрузить обращения: '+e.message)}}}
// Lightweight call overlays: selectable emoji masks/stickers over the video preview (not face-tracked AR).
function bg5InstallCallOverlays(){const box=document.querySelector('.callbox');if(!box||box.querySelector('#bg5CallEffects'))return;const local=$('localVideo');if(!local)return;const wrap=local.parentElement;wrap.style.position='relative';const overlay=document.createElement('div');overlay.id='bg5FaceOverlay';overlay.textContent='';overlay.style.cssText='position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);font-size:52px;pointer-events:none;filter:drop-shadow(0 2px 5px #0009);';wrap.append(overlay);const bar=document.createElement('div');bar.id='bg5CallEffects';bar.style.cssText='display:flex;gap:6px;flex-wrap:wrap;justify-content:center';bar.innerHTML=['😎','🐱','👑','🐰','👽','✨','✖'].map((x,i)=>`<button type="button" class="secondary" data-mask="${i}" style="padding:7px 10px">${x}</button>`).join('');box.insertBefore(bar,box.querySelector('p')||box.lastElementChild);bar.querySelectorAll('[data-mask]').forEach(b=>b.onclick=()=>{const x=b.textContent;overlay.textContent=x==='✖'?'':x})}
// Apply archive and block-list filters without changing the original chat rendering.
const bg5OriginalRenderChats=renderChats;
renderChats=function(){const old=chatCache,arch=bg5Archived(),blocked=bg5Blocked();chatCache=old.filter(c=>!arch.has(c.id)&&!(c.kind==='personal'&&blocked.has((c.participants||[]).find(x=>x!==currentUser?.uid))));try{bg5OriginalRenderChats()}finally{chatCache=old}};
const bg5OriginalRenderPeople=renderPeople;
renderPeople=function(){const old=people,blocked=bg5Blocked();people=old.filter(p=>!blocked.has(p.id));try{bg5OriginalRenderPeople()}finally{people=old}};
$('bg5Catalog').onclick=bg5Catalog;$('bg5Stickers').onclick=bg5StickerPicker;$('bg5Archive').onclick=bg5Archive;$('bg5Support').onclick=bg5Support;$('bg5Username').onclick=bg5Username;$('bg5Blocklist').onclick=bg5Blocklist;$('bg5ChatSettings').onclick=bg5ChatSettings;$('chatTitle').style.cursor='pointer';$('chatTitle').addEventListener('click',()=>{if(activeChat?.otherId){const u=allUsers.find(x=>x.id===activeChat.otherId);if(u)bg5OpenProfile(u,false)}});
// Add a sticker shortcut to the composer controls.
$('reactBtn')?.insertAdjacentHTML('afterend','<button id="bg5StickerQuick" class="secondary" type="button">🧩 Стикер</button>');$('bg5StickerQuick').onclick=bg5StickerPicker;


// Blackgram 5.1: long-press message actions; suppress browser selection/context menu.
(()=>{
 let holdTimer=null,holdTarget=null,holdTriggered=false,startX=0,startY=0;
 const clearHold=()=>{if(holdTimer)clearTimeout(holdTimer);holdTimer=null;holdTarget=null};
 document.addEventListener('contextmenu',e=>{
   const bubble=e.target.closest?.('.bubble[data-id]');
   if(bubble){e.preventDefault();e.stopPropagation();openMsgMenu(bubble.dataset.id)}
 },true);
 document.addEventListener('selectstart',e=>{
   if(!e.target.closest?.('input,textarea,[contenteditable="true"]'))e.preventDefault();
 },true);
 document.addEventListener('pointerdown',e=>{
   const bubble=e.target.closest?.('.bubble[data-id]');
   if(!bubble||e.pointerType==='mouse')return;
   clearHold();holdTarget=bubble;holdTriggered=false;startX=e.clientX;startY=e.clientY;
   holdTimer=setTimeout(()=>{
     if(!holdTarget||!document.body.contains(holdTarget))return;
     holdTriggered=true;
     if(navigator.vibrate)navigator.vibrate(18);
     openMsgMenu(holdTarget.dataset.id);
   },430);
 },{capture:true,passive:true});
 document.addEventListener('pointermove',e=>{
   if(holdTimer&&(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12))clearHold();
 },{capture:true,passive:true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,clearHold,{capture:true,passive:true}));
 document.addEventListener('click',e=>{
   if(holdTriggered){e.preventDefault();e.stopPropagation();holdTriggered=false}
 },true);
})();


// Blackgram 5.3.2: four Telegram-inspired upgrades, adapted to Firebase.
let bg5ChatFilter='all';
const bg5FilterHost=$('bg5ChatFilters');
if(bg5FilterHost){
 bg5FilterHost.addEventListener('click',e=>{const b=e.target.closest('[data-chat-filter]');if(!b)return;bg5ChatFilter=b.dataset.chatFilter;bg5FilterHost.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));if(listMode==='chats')renderChats()});
}
// Rebuild the chat list from the full cache so archived chats can be viewed without losing existing pinning/search behavior.
renderChats=function(){
 if(!currentUser)return;
 const original=chatCache,arch=bg5Archived(),blocked=bg5Blocked();
 let filtered=original.filter(c=>!(c.kind==='personal'&&blocked.has((c.participants||[]).find(x=>x!==currentUser.uid))));
 if(bg5ChatFilter==='archive')filtered=filtered.filter(c=>arch.has(c.id));
 else {filtered=filtered.filter(c=>!arch.has(c.id));if(['personal','group','channel'].includes(bg5ChatFilter))filtered=filtered.filter(c=>c.kind===bg5ChatFilter);}
 chatCache=filtered;
 try{bg5OriginalRenderChats()}finally{chatCache=original}
};
// Keep the filter strip visible only in the chats view.
const bg5SetModeBase=setMode;
setMode=function(mode,render=true){bg5SetModeBase(mode,render);if(bg5FilterHost)bg5FilterHost.style.display=mode==='chats'?'flex':'none'};
if(bg5FilterHost)bg5FilterHost.style.display=listMode==='chats'?'flex':'none';
// Render forwarding attribution and a playback-speed control for voice messages.
const bg5PaintMessageBase=paintMessage;
paintMessage=function(el,m,id){
 bg5PaintMessageBase(el,m,id);
 if(m.forwardedFrom?.name){const body=el.querySelector('.msgtext');if(body){const tag=document.createElement('small');tag.className='forwarded-label';tag.textContent='➦ Переслано от '+m.forwardedFrom.name;body.prepend(tag)}}
 const audio=el.querySelector('audio');
 if(audio&&!audio.dataset.bg5Speed){audio.dataset.bg5Speed='1';const row=document.createElement('div');row.className='voice-controls';const btn=document.createElement('button');btn.type='button';btn.className='voice-speed';btn.textContent='1×';btn.onclick=()=>{const speeds=[1,1.5,2,.5],cur=Number(audio.playbackRate)||1,next=speeds[(speeds.indexOf(cur)+1)%speeds.length];audio.playbackRate=next;btn.textContent=next+'×'};row.append(btn);audio.parentElement?.append(row)}
};
// A reaction button opens a broad quick-reaction sheet; tapping an item sends it to the most recent message.
$('reactBtn').onclick=()=>{if(!activeChat)return alert('Сначала открой чат');const last=[...msgData.entries()].slice(-1)[0];modal(`<h3>😊 Реакции Blackgram</h3><p class="hint">Выбери эмодзи. Если в чате есть сообщение, реакция применится к последнему сообщению.</p><div class="reactpick">${REACTS.concat(['🥳','🙏','💯','👏','🤝','💜','💙','🤍']).map(e=>`<button type="button" data-quick-react="${e}">${e}</button>`).join('')}</div><p class="hint">Для реакции на конкретное сообщение удерживай его пальцем.</p>`);document.querySelectorAll('[data-quick-react]').forEach(b=>b.onclick=async()=>{if(last){await toggleReaction(last[0],b.dataset.quickReact);closeModal()}else{bg5AddText(b.dataset.quickReact);closeModal()}})};

</script></body></html>
