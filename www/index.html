<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Blackgram</title>
<style>
:root{color-scheme:dark;--bg:#0e1621;--panel:#17212b;--panel2:#202c38;--line:#263746;--text:#f5f7fa;--muted:#91a2b3;--accent:#3390ec;--danger:#ff647c;--green:#38c98a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.45}input{width:100%;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:#0e1823;color:var(--text);outline:none}input:focus{border-color:var(--accent)}.muted{color:var(--muted)}.small{font-size:12px}
#auth{max-width:420px;margin:8vh auto;padding:22px}.brand{font-size:31px;font-weight:850;letter-spacing:-1.4px;margin-bottom:6px}.brand span{color:#54a8ff}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:22px}.stack{display:grid;gap:12px}.switch{background:transparent;color:#70b7ff;padding:6px}
#app{display:none;max-width:1200px;margin:auto;height:100dvh;min-height:560px;grid-template-columns:340px minmax(0,1fr);overflow:hidden;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.top{height:66px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.top .brand{font-size:25px;margin:0}.top button{background:var(--panel2);padding:9px 12px;font-size:13px}.side-tools{padding:13px 14px 9px}.search-wrap{position:relative}.search-wrap:before{content:'⌕';position:absolute;left:14px;top:7px;font-size:24px;color:var(--muted)}#search{padding-left:42px;background:#0e1823;border:0;border-radius:22px}.filters{display:flex;gap:7px;padding:4px 14px 12px}.filter{background:transparent;color:var(--muted);font-size:13px;padding:7px 13px;border-radius:18px}.filter.active{background:#203b55;color:#79bdff}#me{padding:10px 18px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#people{overflow:auto;flex:1}.person{width:100%;text-align:left;background:transparent;border-radius:0;border-bottom:1px solid rgba(49,68,84,.48);padding:12px 15px;color:var(--text);display:flex;align-items:center;gap:12px;font-weight:500}.person:hover,.person.active{background:#202e3b}.avatar{width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#397fc1,#7859a9);font-size:19px;font-weight:700;color:white}.person .person-info{min-width:0;flex:1}.person .person-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.person small{display:block;color:var(--muted);font-weight:400;margin-top:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:#0e1621}.chathead{height:66px;padding:8px 20px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:13px;background:var(--panel)}.head-avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#397fc1,#7859a9);font-size:18px}.head-meta{min-width:0}.head-name{font-size:15px}.head-status{font-size:12px;color:var(--green);font-weight:400;margin-top:3px}.head-spacer{flex:1}.head-action{background:transparent;color:#a9bac9;padding:9px;font-size:20px}.back{display:none;background:transparent;padding:5px 8px;font-size:26px;color:#9ecfff}.messages{flex:1;overflow:auto;padding:22px clamp(12px,4vw,48px);display:flex;flex-direction:column;gap:9px;background-color:#0e1621;background-image:radial-gradient(rgba(73,105,132,.10) .8px,transparent .8px);background-size:18px 18px}.bubble{max-width:min(76%,520px);padding:10px 13px;border-radius:15px 15px 15px 4px;background:#182533;align-self:flex-start;overflow-wrap:anywhere;box-shadow:0 1px 1px #0002}.bubble.mine{align-self:flex-end;background:#245b83;border-radius:15px 15px 4px 15px}.bubble time{display:block;font-size:10px;color:#b7c9d8;margin-top:4px;text-align:right}.send{display:flex;gap:9px;padding:12px 16px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--panel)}.send input{flex:1;min-width:0;border:0;border-radius:22px;background:#0e1823;padding:13px 17px}.send button{width:45px;height:45px;padding:0;border-radius:50%;font-size:19px}.empty{margin:auto;text-align:center;color:var(--muted);padding:24px;max-width:360px}.empty-mark{width:74px;height:74px;border-radius:50%;margin:0 auto 15px;display:grid;place-items:center;background:#1c3348;color:#70b7ff;font-size:34px}#error{color:var(--danger);font-size:13px;min-height:18px}
@media(max-width:650px){#app{height:100dvh;min-height:0;display:none;grid-template-columns:1fr;border:0}#app.chat-open .sidebar{display:none}#app:not(.chat-open) .chat{display:none}.sidebar{border:0}.top{height:60px;padding:0 16px}.top .brand{font-size:24px}.side-tools{padding:12px 13px 7px}.filters{padding-bottom:9px}#me{padding:8px 15px}.person{padding:11px 14px}.chathead{height:60px;padding:7px 10px;gap:9px}.back{display:block}.head-avatar{width:40px;height:40px;flex-basis:40px}.messages{padding:14px 10px}.bubble{max-width:88%}.send{padding:9px 10px;padding-bottom:max(9px,env(safe-area-inset-bottom))}.send input{padding:12px 15px}.head-action{font-size:18px;padding:7px}}
</style>
</head>
<body>
<section id="auth">
  <div class="brand">Black<span>gram</span></div>
  <div class="muted">Мессенджер для общения</div>
  <div class="card stack">
    <h2 id="authTitle" style="margin:0">Вход</h2>
    <input id="name" placeholder="Твоё имя (для регистрации)" autocomplete="name" style="display:none">
    <input id="email" type="email" placeholder="Электронная почта" autocomplete="email">
    <input id="password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
    <button id="authBtn">Войти</button>
    <button class="switch" id="modeBtn">Нет аккаунта? Зарегистрироваться</button>
    <div id="error"></div>
    <div class="small muted">Для входа используй свой аккаунт Blackgram. Никому не сообщай пароль.</div>
  </div>
</section>
<main id="app">
  <aside class="sidebar">
    <div class="top"><div class="brand">Black<span>gram</span></div><button id="logout">Выйти</button></div>
    <div class="side-tools"><div class="search-wrap"><input id="search" placeholder="Поиск" autocomplete="off"></div></div>
    <div id="me">Загрузка...</div>
    <div id="people"></div>
  </aside>
  <section class="chat">
    <div class="chathead" id="chatTitle"><div class="head-avatar">✈</div><div class="head-meta"><div class="head-name">Blackgram</div><div class="head-status" style="color:var(--muted)">Твоя территория общения</div></div></div>
    <div class="messages" id="messages"><div class="empty"><div class="empty-mark">✈</div><b>Blackgram</b><p>Выбери чат слева, чтобы начать общение</p></div></div>
    <form class="send" id="sendForm"><input id="message" placeholder="Сообщение..." autocomplete="off" disabled><button id="sendBtn" aria-label="Отправить" disabled>➤</button></form>
  </section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, where, getDocs } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC8ib7JhKn-Q2ltqHD0bEhTHx21HId2FSw",
  authDomain: "blackgram-35ecf.firebaseapp.com",
  projectId: "blackgram-35ecf",
  storageBucket: "blackgram-35ecf.firebasestorage.app",
  messagingSenderId: "607142975760",
  appId: "1:607142975760:web:cbbefd79ce7d07215aed95a",
  measurementId: "G-2DFC2PNFS9"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);
const $ = id => document.getElementById(id);
let registering = false, currentUser = null, activeChat = null, stopPeople = null, stopMessages = null;

function showError(message){ $("error").textContent = message || ""; }
$("modeBtn").onclick = () => {
  registering = !registering;
  $("authTitle").textContent = registering ? "Регистрация" : "Вход";
  $("authBtn").textContent = registering ? "Создать аккаунт" : "Войти";
  $("name").style.display = registering ? "block" : "none";
  $("modeBtn").textContent = registering ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
  showError("");
};
$("authBtn").onclick = async () => {
  showError("");
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password) return showError("Введи почту и пароль.");
  if (registering && !$("name").value.trim()) return showError("Введи своё имя.");
  if (registering && password.length < 6) return showError("Пароль должен быть не короче 6 символов.");
  $("authBtn").disabled = true;
  try {
    if (registering) {
      const cred = await createUserWithEmailAndPassword(auth,email,password);
      const displayName = $("name").value.trim().slice(0,40);
      await updateProfile(cred.user,{displayName});
      await setDoc(doc(db,"users",cred.user.uid),{name:displayName,email:cred.user.email,createdAt:serverTimestamp()});
    } else await signInWithEmailAndPassword(auth,email,password);
  } catch(e) {
    const messages = { "auth/email-already-in-use":"Этот адрес уже зарегистрирован.","auth/invalid-email":"Неправильный адрес почты.","auth/weak-password":"Пароль слишком простой.","auth/invalid-credential":"Неверная почта или пароль.","auth/network-request-failed":"Проверь подключение к интернету." };
    showError(messages[e.code] || ("Ошибка: "+e.message));
  } finally { $("authBtn").disabled = false; }
};

$("logout").onclick = () => signOut(auth);
onAuthStateChanged(auth, async user => {
  currentUser = user;
  $("auth").style.display = user ? "none" : "block";
  $("app").style.display = user ? "grid" : "none";
  if (!user) { if(stopPeople) stopPeople(); if(stopMessages) stopMessages(); activeChat=null; return; }
  $("me").textContent = "Ты: " + (user.displayName || user.email);
  loadPeople();
});

function loadPeople(){
  if(stopPeople) stopPeople();
  const q = query(collection(db,"users"),orderBy("name"));
  stopPeople = onSnapshot(q,snap => {
    const host=$("people"); host.innerHTML="";
    snap.forEach(d=>{
      if(d.id===currentUser.uid) return;
      const u=d.data(), b=document.createElement("button"), name=u.name || u.email || "Пользователь";
      b.className="person"+(activeChat && activeChat.otherId===d.id?" active":"");
      const avatar=document.createElement("span"); avatar.className="avatar"; avatar.textContent=name.trim().charAt(0).toUpperCase();
      const info=document.createElement("span"); info.className="person-info";
      const title=document.createElement("span"); title.className="person-name"; title.textContent=name;
      const sub=document.createElement("small"); sub.textContent=u.email || "Пользователь Blackgram";
      info.append(title,sub); b.append(avatar,info);
      b.onclick=()=>openChat(d.id,name);
      host.appendChild(b);
    });
    if(!host.children.length) host.innerHTML='<div class="empty">Пока нет других пользователей. Пусть друг зарегистрируется в Blackgram.</div>';
  },e=>showChatError(e));
}
$("search").addEventListener("input",()=>{
  const term=$("search").value.trim().toLocaleLowerCase("ru");
  document.querySelectorAll(".person").forEach(el=>{el.style.display=el.textContent.toLocaleLowerCase("ru").includes(term)?"flex":"none";});
});

function escapeText(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showChatError(e){ $("messages").innerHTML='<div class="empty">Не удалось загрузить данные. Проверь правила Firestore.</div>'; console.error(e); }
async function openChat(otherId,otherName){
  const ids=[currentUser.uid,otherId].sort();
  const chatId=ids.join("_");
  activeChat={id:chatId,otherId,name:otherName};
  $("app").classList.add("chat-open");
  $("chatTitle").innerHTML='<button class="back" id="backBtn" type="button" aria-label="Назад">‹</button><div class="head-avatar">'+escapeText(otherName.charAt(0).toUpperCase())+'</div><div class="head-meta"><div class="head-name">'+escapeText(otherName)+'</div><div class="head-status">чат Blackgram</div></div><div class="head-spacer"></div><span class="head-action">⋮</span>';
  $("backBtn").onclick=()=>$("app").classList.remove("chat-open");
  $("message").disabled=false; $("sendBtn").disabled=false;
  try {
    const ref=doc(db,"chats",chatId), snap=await getDoc(ref);
    if(!snap.exists()) await setDoc(ref,{participants:ids,createdAt:serverTimestamp()});
    if(stopMessages) stopMessages();
    $("messages").innerHTML="";
    const q=query(collection(db,"chats",chatId,"messages"),orderBy("createdAt","asc"));
    stopMessages=onSnapshot(q,s=>{
      const host=$("messages"); host.innerHTML="";
      s.forEach(m=>{
        const data=m.data(), div=document.createElement("div");
        div.className="bubble"+(data.senderId===currentUser.uid?" mine":"");
        const body=document.createElement("div"); body.textContent=data.text || "";
        const time=document.createElement("time");
        time.textContent=data.createdAt?.toDate ? data.createdAt.toDate().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) : " ";
        div.append(body,time); host.appendChild(div);
      });
      host.scrollTop=host.scrollHeight;
      if(!s.size) host.innerHTML='<div class="empty">Напиши первое сообщение 👋</div>';
    },showChatError);
  } catch(e){ showChatError(e); }
}
$("sendForm").onsubmit=async e=>{
  e.preventDefault();
  const text=$("message").value.trim();
  if(!text || !activeChat) return;
  $("sendBtn").disabled=true;
  try {
    await addDoc(collection(db,"chats",activeChat.id,"messages"),{text:text.slice(0,4000),senderId:currentUser.uid,createdAt:serverTimestamp()});
    $("message").value="";
  } catch(e){ alert("Не удалось отправить. Проверь правила Firestore и интернет."); console.error(e); }
  finally{$("sendBtn").disabled=false;}
};
</script>
</body>
</html>
