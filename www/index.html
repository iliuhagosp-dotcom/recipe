   &&(!advancedSearch.name||name.includes(advancedSearch.name))
   &&(!advancedSearch.email||email.includes(advancedSearch.email))
   &&(!advancedSearch.status||status.includes(advancedSearch.status));
 });
 arr.sort((a,b)=>advancedSearch.sort==='newest'?((b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)):String(a.name||a.email||'').localeCompare(String(b.name||b.email||''),'ru'));
 $('people').innerHTML='';
 if(!arr.length){$('people').innerHTML='<div class="empty">Никого не найдено. Попробуй изменить запрос или фильтры.</div>';return}
 let count=document.createElement('div');count.className='hint';count.style.padding='5px 12px';count.textContent='Найдено: '+arr.length;$('people').appendChild(count);
 arr.forEach(p=>{let b=document.createElement('button');b.className='person'+(activeChat?.otherId===p.id?' active':'');b.innerHTML=`<span class="profileline">${p.photoURL?`<img class="avatar" src="${safe(p.photoURL)}" alt="">`:'<span class="avatar">👤</span>'}<span>${safe(p.name||'Пользователь')}<small>${safe(p.status||p.email||'')}</small></span></span>`;b.onclick=()=>openPersonal(p);$('people').appendChild(b)});
};
$('advancedSearchBtn').onclick=()=>{modal(`<h3>🔎 Расширенный поиск</h3><p class="hint">Ищи людей по имени, почте или статусу. Результаты доступны среди пользователей, загруженных в Blackgram.</p><div class="stack"><label>Имя или часть имени<input id="filterName" maxlength="60" value="${safe(advancedSearch.name)}" placeholder="Например, Алекс"></label><label>Электронная почта<input id="filterEmail" maxlength="120" value="${safe(advancedSearch.email)}" placeholder="Например, mail@gmail.com"></label><label>Статус / о себе<input id="filterStatus" maxlength="80" value="${safe(advancedSearch.status)}" placeholder="Например, на связи"></label><label>Сортировка<select id="filterSort" style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text)"><option value="name" ${advancedSearch.sort==='name'?'selected':''}>По имени</option><option value="newest" ${advancedSearch.sort==='newest'?'selected':''}>Сначала новые</option></select></label><div class="modalactions"><button id="clearAdvancedSearch" class="secondary">Сбросить</button><button id="applyAdvancedSearch">Найти</button></div></div>`);
 $('applyAdvancedSearch').onclick=()=>{advancedSearch={name:$('filterName').value.trim().toLowerCase(),email:$('filterEmail').value.trim().toLowerCase(),status:$('filterStatus').value.trim().toLowerCase(),sort:$('filterSort').value};closeModal();renderPeople()};
 $('clearAdvancedSearch').onclick=()=>{advancedSearch={name:'',email:'',status:'',sort:'name'};$('search').value='';closeModal();renderPeople()};
};
// Group and channel creation
$('channelBtn').onclick=()=>{modal(`<h3>📢 Создать канал</h3><div class="stack"><input id="channelName" placeholder="Название канала"><input id="channelAbout" placeholder="Описание (необязательно)"><button id="makeChannel">Создать канал</button></div><p class="hint">Канал создаётся в Firestore и доступен создателю. Добавление подписчиков можно делать через участников.</p>`);$('makeChannel').onclick=async()=>{let title=$('channelName').value.trim(),about=$('channelAbout').value.trim();if(title.length<2)return alert('Название слишком короткое');try{let r=await addDoc(collection(db,'chats'),{title:title.slice(0,60),about:about.slice(0,180),kind:'channel',participants:[currentUser.uid],createdBy:currentUser.uid,createdAt:serverTimestamp()});closeModal();openChat({id:r.id,title,kind:'channel',participants:[currentUser.uid]})}catch(e){alert('Не удалось создать канал: '+e.message)}}};
// Voice notes: short recording stored as a data URL in the message document.
let recorder=null,recordChunks=[],recordStream=null;
$('voiceBtn').onclick=async()=>{if(!activeChat)return alert('Сначала открой чат');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return alert('Запись голоса не поддерживается этим устройством');if(recorder?.state==='recording'){recorder.stop();$('voiceBtn').textContent='🎙 Голос';return}try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(recordStream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{try{let blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});if(blob.size>700000){alert('Запись слишком большая. Сделай её короче (до 30–40 секунд).');return}let reader=new FileReader();reader.onloadend=async()=>{try{await addDoc(collection(db,'chats',activeChat.id,'messages'),{text:'Голосовое сообщение',audioData:reader.result,senderId:currentUser.uid,senderName:profile.name||currentUser.displayName||'Пользователь',createdAt:serverTimestamp()})}catch(e){alert('Не удалось отправить аудио: '+e.message)}};reader.readAsDataURL(blob)}finally{recordStream?.getTracks().forEach(t=>t.stop());recordStream=null}};recorder.start();$('voiceBtn').textContent='⏹ Остановить';setTimeout(()=>{if(recorder?.state==='recording'){recorder.stop();$('voiceBtn').textContent='🎙 Голос'}},40000)}catch(e){alert('Нет доступа к микрофону: '+e.message)}};
// Reactions and sticker picker. Reactions are saved on each message document.
$('reactBtn').onclick=()=>{if(!activeChat)return alert('Сначала открой чат');modal(`<h3>😊 Реакции и стикеры</h3><p>Отправь стикер в чат:</p><div class="stack" style="grid-template-columns:repeat(4,1fr)">${['❤️','😂','🔥','👍','🥰','😎','🎉','🤔'].map(x=>`<button data-sticker="${x}">${x}</button>`).join('')}</div><p class="hint">Чтобы поставить реакцию на сообщение, нажми на его значок реакции.</p>`)};
$('modalContent').addEventListener('click',async e=>{let b=e.target.closest('[data-sticker]');if(b&&activeChat){try{await addDoc(collection(db,'chats',activeChat.id,'messages'),{text:b.dataset.sticker,senderId:currentUser.uid,senderName:profile.name||currentUser.displayName||'Пользователь',createdAt:serverTimestamp(),sticker:true});closeModal()}catch(err){alert(err.message)}}});
// Call signaling using Firestore + WebRTC. Both users must be online and grant permissions.
let peer=null,localStream=null,callUnsub=null,currentCallId=null;
async function startCall(video){if(!activeChat?.otherId)return alert('Звонки доступны в личном чате');if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection)return alert('Звонки не поддерживаются этим устройством');try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video});peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream.getTracks().forEach(t=>peer.addTrack(t,localStream));let remote=new MediaStream();peer.ontrack=e=>e.streams[0].getTracks().forEach(t=>remote.addTrack(t));currentCallId='call_'+Date.now()+'_'+currentUser.uid;let callRef=doc(db,'calls',currentCallId);peer.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,'calls',currentCallId,'offerCandidates'),e.candidate.toJSON())};let offer=await peer.createOffer();await peer.setLocalDescription(offer);await setDoc(callRef,{from:currentUser.uid,to:activeChat.otherId,video,offer:{type:offer.type,sdp:offer.sdp},createdAt:serverTimestamp(),status:'ringing'});modal(`<h3>${video?'📹 Видеозвонок':'📞 Аудиозвонок'}</h3><div class="callbox"><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" class="remote" autoplay playsinline></video><p>Ожидание ответа собеседника…</p><button id="endCall" class="danger">Завершить звонок</button></div>`);$('localVideo').srcObject=localStream;peer.ontrack=()=>{$('remoteVideo').srcObject=remote};let answered=false;callUnsub=onSnapshot(callRef,async snap=>{let d=snap.data();if(d?.answer&&!answered){answered=true;await peer.setRemoteDescription(new RTCSessionDescription(d.answer));onSnapshot(collection(db,'calls',currentCallId,'answerCandidates'),ss=>ss.docChanges().forEach(ch=>{if(ch.type==='added')peer?.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(()=>{})}))}});$('endCall').onclick=()=>endCall();}catch(e){await endCall();alert('Не удалось начать звонок: '+e.message)}}
async function endCall(){try{callUnsub?.();callUnsub=null;peer?.close();peer=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;if(currentCallId)await setDoc(doc(db,'calls',currentCallId),{status:'ended'},{merge:true});currentCallId=null;closeModal()}catch(e){console.warn(e)}}

$('callBtn').onclick=()=>startCall(false);$('videoBtn').onclick=()=>startCall(true);
// Incoming-call listener: accept/decline calls from the currently signed-in user.
let stopIncoming=null;function watchIncomingCalls(){if(stopIncoming)stopIncoming();stopIncoming=onSnapshot(query(collection(db,'calls'),where('to','==',currentUser.uid),where('status','==','ringing')),snap=>{snap.docChanges().forEach(change=>{if(change.type!=='added')return;let c=change.doc.data(),cid=change.doc.id;if(!c.offer)return;modal(`<h3>${c.video?'📹 Входящий видеозвонок':'📞 Входящий звонок'}</h3><p>Тебе звонят</p><div class="modalactions"><button id="acceptIncoming">Ответить</button><button id="declineIncoming" class="danger">Отклонить</button></div>`);$('declineIncoming').onclick=async()=>{await setDoc(doc(db,'calls',cid),{status:'declined'},{merge:true});closeModal()};$('acceptIncoming').onclick=async()=>{try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!c.video});peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream.getTracks().forEach(t=>peer.addTrack(t,localStream));let remote=new MediaStream();peer.ontrack=e=>e.streams[0].getTracks().forEach(t=>remote.addTrack(t));peer.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,'calls',cid,'answerCandidates'),e.candidate.toJSON())};await peer.setRemoteDescription(new RTCSessionDescription(c.offer));let answer=await peer.createAnswer();await peer.setLocalDescription(answer);await setDoc(doc(db,'calls',cid),{answer:{type:answer.type,sdp:answer.sdp},status:'answered'},{merge:true});currentCallId=cid;modal(`<h3>Звонок</h3><div class="callbox"><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" autoplay playsinline></video><button id="endCall" class="danger">Завершить</button></div>`);$('localVideo').srcObject=localStream;peer.ontrack=()=>{$('remoteVideo').srcObject=remote};$('endCall').onclick=endCall;let stopCandidates=onSnapshot(collection(db,'calls',cid,'offerCandidates'),ss=>ss.docChanges().forEach(ch=>{if(ch.type==='added')peer.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(()=>{})}));let oldEnd=endCall;endCall=async()=>{stopCandidates();await oldEnd()};}catch(er){alert('Не удалось принять звонок: '+er.message);await endCall()}}})})}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
