async function startCall(video){if(!activeChat?.otherId)return alert('Звонки доступны в личном чате');if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection)return alert('Звонки не поддерживаются этим устройством');try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video});peer=new RTCPeerConnection({iceServers:ICE_SERVERS});localStream.getTracks().forEach(t=>peer.addTrack(t,localStream));let remote=new MediaStream();peer.ontrack=e=>e.streams[0].getTracks().forEach(t=>remote.addTrack(t));window.bg8CallPeer=activeChat.otherId;window.bg8CallVideo=!!video;currentCallId='call_'+Date.now()+'_'+currentUser.uid;let callRef=doc(db,'calls',currentCallId);peer.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,'calls',currentCallId,'offerCandidates'),e.candidate.toJSON())};let offer=await peer.createOffer();await peer.setLocalDescription(offer);await setDoc(callRef,{from:currentUser.uid,to:activeChat.otherId,video,offer:{type:offer.type,sdp:offer.sdp},createdAt:serverTimestamp(),status:'ringing'});modal(`<h3>${video?'📹 Видеозвонок':'📞 Аудиозвонок'}</h3><div class="callbox"><video id="localVideo" autoplay muted playsinline></video><video id="remoteVideo" class="remote" autoplay playsinline></video><p>Ожидание ответа собеседника…</p><button id="endCall" class="danger">Завершить звонок</button></div>`);$('localVideo').srcObject=localStream;bg5InstallCallOverlays();peer.ontrack=()=>{$('remoteVideo').srcObject=remote};let answered=false;callTimer=setTimeout(()=>{if(!answered){endCall();alert('Нет ответа')}},45000);callUnsub=onSnapshot(callRef,async snap=>{let d=snap.data();if(d&&(d.status==='declined'||d.status==='ended')){await endCall();return}if(d?.answer&&!answered){answered=true;clearTimeout(callTimer);await peer.setRemoteDescription(new RTCSessionDescription(d.answer));flushCands();candUnsubs.push(onSnapshot(collection(db,'calls',currentCallId,'answerCandidates'),ss=>ss.docChanges().forEach(ch=>{if(ch.type==='added')feedCand(ch.doc.data())})))}});$('endCall').onclick=()=>endCall();}catch(e){await endCall();alert('Не удалось начать звонок: '+e.message)}}
let candUnsubs=[],pendingCands=[],callTimer=null;
function feedCand(c){if(peer&&peer.remoteDescription)peer.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});else pendingCands.push(c)}
function flushCands(){const a=pendingCands;pendingCands=[];a.forEach(feedCand)}
async function endCall(){try{callUnsub?.();callUnsub=null;clearTimeout(callTimer);candUnsubs.forEach(u=>{try{u()}catch(e){}});candUnsubs=[];pendingCands=[];peer?.close();peer=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;if(currentCallId)await setDoc(doc(db,'calls',currentCallId),{status:'ended'},{merge:true});currentCallId=null;closeModal()}catch(e){console.warn(e)}}

// Blackgram 5.1: long-press message actions; suppress browser selection/context menu.
(()=>{
 let holdTimer=null,holdTarget=null,holdTriggered=false,startX=0,startY=0;
 const clearHold=()=>{if(holdTimer)clearTimeout(holdTimer);holdTimer=null;holdTarget=null};
 document.addEventListener('contextmenu',e=>{
   const bubble=e.target.closest?.('.bubble[data-id]');
   if(bubble){e.preventDefault();e.stopPropagation();openMsgMenu(bubble.dataset.id)}
 },true);
 document.addEventListener('selectstart',e=>{
   if(!e.target.closest?.('input,textarea,[contenteditable="true"]'))e.preventDefault();
 },true);
 document.addEventListener('pointerdown',e=>{
   const bubble=e.target.closest?.('.bubble[data-id]');
   if(!bubble||e.pointerType==='mouse')return;
   clearHold();holdTarget=bubble;holdTriggered=false;startX=e.clientX;startY=e.clientY;
   holdTimer=setTimeout(()=>{
     if(!holdTarget||!document.body.contains(holdTarget))return;
     holdTriggered=true;
     if(navigator.vibrate)navigator.vibrate(18);
     openMsgMenu(holdTarget.dataset.id);
   },430);
 },{capture:true,passive:true});
 document.addEventListener('pointermove',e=>{
   if(holdTimer&&(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12))clearHold();
 },{capture:true,passive:true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,clearHold,{capture:true,passive:true}));
 document.addEventListener('click',e=>{
   if(holdTriggered){e.preventDefault();e.stopPropagation();holdTriggered=false}
 },true);
})();

// Rebuild the chat list from the full cache so archived chats can be viewed without losing existing pinning/search behavior.
renderChats=function(){
 if(!currentUser)return;
 const original=chatCache,arch=bg5Archived(),blocked=bg5Blocked();
 let filtered=original.filter(c=>!(c.kind==='personal'&&blocked.has((c.participants||[]).find(x=>x!==currentUser.uid))));
 if(bg5ChatFilter==='archive')filtered=filtered.filter(c=>arch.has(c.id));
 else {filtered=filtered.filter(c=>!arch.has(c.id));if(['personal','group','channel'].includes(bg5ChatFilter))filtered=filtered.filter(c=>c.kind===bg5ChatFilter);}
 chatCache=filtered;
 try{bg5OriginalRenderChats()}finally{chatCache=original}
};

  const bg=document.createElement('div');bg.className='bg8-call-bg';
  if(photo)bg.style.backgroundImage='url("'+String(photo).replace(/"/g,'%22')+'")';

  const av=photo?'<img class="bg8-call-av" src="'+safe(photo)+'" alt="">':'<div class="bg8-call-av bg8-call-ph">'+safe((name[0]||'?').toUpperCase())+'</div>';
  ui.innerHTML=av+'<div class="bg8-call-name">'+safe(name)+'</div><div class="bg8-call-st" id="bg8CallSt">'+(inc?(video?'Входящий видеозвонок…':'Входящий звонок…'):'Вызов…')+'</div><div class="bg8-call-btns" id="bg8CallBtns"></div>';
  mc.prepend(bg);mc.append(ui);
  const row=ui.querySelector('#bg8CallBtns');
  if(inc){
   const dec=$('declineIncoming'),acc=$('acceptIncoming');
   dec.innerHTML=BG8_ICO.phone;acc.innerHTML=BG8_ICO.phone;
   row.append(mk(dec,'Отклонить','bg8-end'),mk(acc,'Ответить','bg8-ok'));
  }else{
   const mic=document.createElement('button');mic.type='button';mic.innerHTML=BG8_ICO.mic;
   mic.onclick=()=>{let on=true;localStream?.getAudioTracks().forEach(t=>{t.enabled=!t.enabled;on=t.enabled});mic.classList.toggle('off',!on)};
   row.append(mk(mic,'Микрофон'));
   if(video){
    const cam=document.createElement('button');cam.type='button';cam.innerHTML=BG8_ICO.cam;
    cam.onclick=()=>{let on=true;localStream?.getVideoTracks().forEach(t=>{t.enabled=!t.enabled;on=t.enabled});cam.classList.toggle('off',!on)};
    row.append(mk(cam,'Камера'));
   }
   const end=$('endCall');
   if(end){end.innerHTML=BG8_ICO.phone;row.append(mk(end,'Завершить','bg8-end'))}
  }
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{
   if(modalEl.classList.contains('hidden')){stop();return}
   const st=$('bg8CallSt');if(!st)return;
   const rv=$('remoteVideo'),tr=rv&&rv.srcObject?rv.srcObject.getTracks():[];
   const live=tr.some(t=>t.readyState==='live');
   if(live){if(!t0)t0=Date.now();const sec=Math.floor((Date.now()-t0)/1000);st.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
   modalEl.classList.toggle('bg8-rv',!!(rv&&rv.srcObject&&rv.srcObject.getVideoTracks().some(t=>t.readyState==='live')));

 }
 new MutationObserver(build).observe(mc,{childList:true});
})();
