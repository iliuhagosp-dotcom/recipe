<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220">
<title>Blackgram</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--panel2:#1a2940;--line:#26364d;--text:#f3f6fb;--muted:#9aabc1;--accent:#4d8dff;--danger:#ff6577;--green:#45c69a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:var(--panel2);border:1px solid var(--line)}.danger{background:#6d2938}.muted{color:var(--muted)}.small{font-size:12px}input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0d1727;color:var(--text);outline:none}input:focus{border-color:var(--accent)}#auth{max-width:430px;margin:7vh auto;padding:22px}.brand{font-size:32px;font-weight:850;letter-spacing:-1.5px;margin-bottom:6px}.brand span{color:var(--accent)}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:22px}.stack{display:grid;gap:12px}.switch{background:transparent;color:#8fb6ff;padding:6px}#error{color:var(--danger);font-size:13px;min-height:18px}#app{display:none;max-width:1200px;margin:auto;min-height:100vh;grid-template-columns:300px 1fr;border-left:1px solid var(--line);border-right:1px solid var(--line)}.sidebar{background:var(--panel);border-right:1px solid var(--line);min-height:100vh;display:flex;flex-direction:column;min-width:0}.top{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}.top .brand{font-size:24px;margin:0}.me{padding:12px 16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.tools{display:flex;gap:7px;padding:10px}.tools button{flex:1;padding:9px 6px;font-size:12px}.search{padding:0 10px 10px}#people{overflow:auto;flex:1}.person{width:100%;text-align:left;background:transparent;border-radius:0;border-bottom:1px solid var(--line);padding:13px 15px;color:var(--text);display:block}.person.active{background:var(--panel2)}.person small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.chat{display:flex;flex-direction:column;min-height:100vh;min-width:0}.chathead{padding:16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}.chathead small{display:block;font-size:11px;color:var(--muted);font-weight:400}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:78%;padding:10px 13px;border-radius:16px;background:var(--panel2);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:#2457a6}.bubble time{display:block;font-size:10px;color:#c5d5eb;margin-top:4px;text-align:right}.send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom))}.send input{flex:1;min-width:0}.empty{margin:auto;text-align:center;color:var(--muted);padding:24px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:5}.modalbox{width:min(500px,100%);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.modalbox h3{margin-top:0}.modalrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.modalrow span{overflow-wrap:anywhere}.modalactions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.adminuser{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.adminuser small{display:block;color:var(--muted);overflow-wrap:anywhere}.hint{font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:700px){#app{grid-template-columns:118px 1fr}.top{padding:10px 7px;display:block}.top .brand{font-size:19px}.top button{padding:8px 6px;font-size:11px;margin-top:7px;width:100%}.me{padding:9px 7px;font-size:10px}.tools{padding:6px;display:grid;grid-template-columns:1fr}.tools button{font-size:10px;padding:7px 3px}.search{padding:0 6px 7px}.person{padding:12px 7px;font-size:12px;overflow-wrap:anywhere}.person small{font-size:9px}.chathead{padding:13px 9px;font-size:14px}.messages{padding:12px 8px}.send{padding:9px 7px}.bubble{max-width:92%}.chathead button{padding:8px;font-size:11px}}
</style></head><body>
<section id="auth"><div class="brand">Black<span>gram</span></div><div class="muted">Мессенджер для общения</div><div class="card stack"><h2 id="authTitle" style="margin:0">Вход</h2><input id="name" placeholder="Твоё имя" autocomplete="name" class="hidden"><input id="email" type="email" placeholder="Электронная почта" autocomplete="email"><input id="password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password"><button id="authBtn">Войти</button><button class="switch" id="modeBtn">Нет аккаунта? Зарегистрироваться</button><div id="error"></div><div class="hint">Создай аккаунт и попроси друзей зарегистрироваться с другого телефона. Никому не сообщай пароль.</div></div></section>
<main id="app"><aside class="sidebar"><div class="top"><div class="brand">Black<span>gram</span></div><button id="logout" class="secondary">Выйти</button></div><div class="me" id="me">Загрузка...</div><div class="tools"><button id="newGroup">＋ Группа</button><button id="savedBtn" class="secondary">★ Избранное</button><button id="adminBtn" class="secondary hidden">⚙ Админка</button></div><div class="search"><input id="search" placeholder="Поиск людей..."></div><div id="people"></div></aside><section class="chat"><div class="chathead"><div><span id="chatTitle">Выбери собеседника</span><small id="chatSub">Blackgram · онлайн-общение</small></div><button id="chatInfo" class="secondary hidden">Участники</button></div><div class="messages" id="messages"><div class="empty">Выбери пользователя слева, чтобы начать общение 👋</div></div><form class="send" id="sendForm"><input id="message" placeholder="Написать сообщение..." autocomplete="off" disabled><button id="sendBtn" disabled>➤</button></form></section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalContent"></div><div class="modalactions"><button id="modalClose" class="secondary">Закрыть</button></div></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc,collection,query,orderBy,onSnapshot,addDoc,serverTimestamp,where,getDocs,limit} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyC8ib7JhKn-Q2ltqHD0bEhTHx21HId2FSw',authDomain:'blackgram-35ecf.firebaseapp.com',projectId:'blackgram-35ecf',storageBucket:'blackgram-35ecf.firebasestorage.app',messagingSenderId:'607142975760',appId:'1:607142975760:web:cbbefd79ce7d07215aed95a',measurementId:'G-2DFC2PNFS9'};
const ADMIN_EMAIL='iliuhagosp@gmail.com';const appFirebase=initializeApp(firebaseConfig),auth=getAuth(appFirebase),db=getFirestore(appFirebase);const $=id=>document.getElementById(id);let registering=false,currentUser=null,profile=null,people=[],activeChat=null,stopPeople=null,stopMessages=null,stopChatList=null,chatCache=[];
const err=t=>{$('error').textContent=t||''};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function modal(html){$('modalContent').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}$('modalClose').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
$('modeBtn').onclick=()=>{registering=!registering;$('authTitle').textContent=registering?'Регистрация':'Вход';$('authBtn').textContent=registering?'Создать аккаунт':'Войти';$('name').classList.toggle('hidden',!registering);$('modeBtn').textContent=registering?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться';err('')};
$('authBtn').onclick=async()=>{err('');let email=$('email').value.trim().toLowerCase(),password=$('password').value,name=$('name').value.trim();if(!email||!password)return err('Введи почту и пароль');if(registering&&name.length<2)return err('Имя должно содержать хотя бы 2 символа');if(password.length<6)return err('Пароль должен быть не короче 6 символов');$('authBtn').disabled=true;try{if(registering){let c=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(c.user,{displayName:name});await setDoc(doc(db,'users',c.user.uid),{name,email,role:email===ADMIN_EMAIL?'admin':'user',blocked:false,createdAt:serverTimestamp()});}else await signInWithEmailAndPassword(auth,email,password)}catch(e){let m={'auth/email-already-in-use':'Эта почта уже зарегистрирована','auth/invalid-email':'Неправильная почта','auth/weak-password':'Пароль слишком простой','auth/invalid-credential':'Неверная почта или пароль','auth/network-request-failed':'Проверь интернет'};err(m[e.code]||e.message)}finally{$('authBtn').disabled=false}};
$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,async user=>{currentUser=user;if(stopPeople)stopPeople();if(stopMessages)stopMessages();if(stopChatList)stopChatList();activeChat=null;$('auth').style.display=user?'none':'block';$('app').style.display=user?'grid':'none';if(!user)return;try{let p=await getDoc(doc(db,'users',user.uid));profile=p.exists()?p.data():{name:user.displayName||user.email,role:'user'};if(!p.exists())await setDoc(doc(db,'users',user.uid),{name:user.displayName||user.email,email:user.email,role:user.email===ADMIN_EMAIL?'admin':'user',blocked:false,createdAt:serverTimestamp()});if(profile.blocked){await signOut(auth);return err('Аккаунт заблокирован')}$('me').textContent='Ты: '+(profile.name||user.email);$('adminBtn').classList.toggle('hidden',!(profile.role==='admin'||user.email===ADMIN_EMAIL));loadPeople();}catch(e){console.error(e);alert('Не удалось загрузить профиль. Проверь правила Firestore.')}});
function loadPeople(){if(stopPeople)stopPeople();stopPeople=onSnapshot(query(collection(db,'users'),orderBy('name')),s=>{people=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.id!==currentUser.uid&&!p.blocked);renderPeople()},e=>{console.error(e);$('people').innerHTML='<div class="empty">Ошибка доступа к списку пользователей</div>'});}
function renderPeople(){let f=$('search').value.trim().toLowerCase(),arr=people.filter(p=>(p.name||p.email||'').toLowerCase().includes(f));$('people').innerHTML='';if(!arr.length){$('people').innerHTML='<div class="empty">Нет пользователей</div>';return}arr.forEach(p=>{let b=document.createElement('button');b.className='person'+(activeChat?.otherId===p.id?' active':'');b.innerHTML=`${safe(p.name||'Пользователь')}<small>${safe(p.email||'')}</small>`;b.onclick=()=>openPersonal(p);$('people').appendChild(b)})}$('search').oninput=renderPeople;
async function openPersonal(p){let ids=[currentUser.uid,p.id].sort(),id='dm_'+ids.join('_'),ref=doc(db,'chats',id);try{let s=await getDoc(ref);if(!s.exists())await setDoc(ref,{title:p.name||p.email,kind:'personal',participants:ids,createdBy:currentUser.uid,createdAt:serverTimestamp()});openChat({id,title:p.name||p.email,kind:'personal',otherId:p.id})}catch(e){alert('Не удалось открыть чат: '+e.message)}}
async function openSaved(){let id='saved_'+currentUser.uid,ref=doc(db,'chats',id),s=await getDoc(ref);if(!s.exists())await setDoc(ref,{title:'Избранное',kind:'saved',participants:[currentUser.uid],createdBy:currentUser.uid,createdAt:serverTimestamp()});openChat({id,title:'★ Избранное',kind:'saved'})}$('savedBtn').onclick=openSaved;
function openChat(chat){activeChat=chat;$('chatTitle').textContent=chat.title;$('chatSub').textContent=chat.kind==='group'?'Групповой чат':chat.kind==='saved'?'Личные заметки':'Личная переписка';$('message').disabled=false;$('sendBtn').disabled=false;$('chatInfo').classList.toggle('hidden',!['group','channel'].includes(chat.kind));if(stopMessages)stopMessages();$('messages').innerHTML='<div class="empty">Загрузка сообщений...</div>';let q=query(collection(db,'chats',chat.id,'messages'),orderBy('createdAt','asc'),limit(300));stopMessages=onSnapshot(q,s=>{let host=$('messages');host.innerHTML='';s.forEach(d=>{let m=d.data(),el=document.createElement('div');el.className='bubble'+(m.senderId===currentUser.uid?' mine':'');let n=document.createElement('small');n.className='muted';n.textContent=m.senderName||'Пользователь';let body=document.createElement('div');body.textContent=m.text||'';let time=document.createElement('time');time.textContent=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';el.append(n,body,time);host.append(el)});if(!s.size)host.innerHTML='<div class="empty">Напиши первое сообщение 👋</div>';host.scrollTop=host.scrollHeight},e=>{console.error(e);$('messages').innerHTML='<div class="empty">Нет доступа к сообщениям. Проверь правила Firestore.</div>'})}
$('sendForm').onsubmit=async e=>{e.preventDefault();let text=$('message').value.trim();if(!text||!activeChat)return;$('sendBtn').disabled=true;try{await addDoc(collection(db,'chats',activeChat.id,'messages'),{text:text.slice(0,4000),senderId:currentUser.uid,senderName:profile.name||currentUser.displayName||'Пользователь',createdAt:serverTimestamp()});$('message').value=''}catch(e){alert('Не удалось отправить сообщение: '+e.message)}finally{$('sendBtn').disabled=false}};
$('newGroup').onclick=()=>{if(people.length<1)return alert('Сначала пусть хотя бы один друг зарегистрируется');modal(`<h3>Создать группу</h3><input id="groupName" placeholder="Название группы"><p class="hint">Выбери участников</p><div id="groupMembers">${people.map(p=>`<label class="modalrow"><span>${safe(p.name||p.email)}</span><input type="checkbox" value="${p.id}" style="width:20px"></label>`).join('')}</div><button id="createGroup">Создать группу</button>`);$('createGroup').onclick=async()=>{let title=$('groupName').value.trim(),ids=[...$('groupMembers').querySelectorAll('input:checked')].map(x=>x.value);if(title.length<2)return alert('Введи название');if(!ids.length)return alert('Выбери хотя бы одного участника');try{ids.push(currentUser.uid);let r=await addDoc(collection(db,'chats'),{title:title.slice(0,60),kind:'group',participants:ids,createdBy:currentUser.uid,createdAt:serverTimestamp()});closeModal();openChat({id:r.id,title,kind:'group'})}catch(e){alert(e.message)}}};
$('chatInfo').onclick=()=>{if(!activeChat)return;let names=(activeChat.participants||[]).map(id=>people.find(p=>p.id===id)?.name|| (id===currentUser.uid?'Ты':'Участник'));modal(`<h3>${safe(activeChat.title)}</h3><p>Участники</p>${names.map(n=>`<div class="modalrow">${safe(n)}</div>`).join('')}`)};
$('adminBtn').onclick=async()=>{try{let s=await getDocs(query(collection(db,'users'),orderBy('createdAt','desc'))),users=s.docs.map(d=>({id:d.id,...d.data()}));let stats={users:users.length};modal(`<h3>Админ-панель</h3><p class="hint">Пользователей: ${stats.users}</p><div>${users.map(u=>`<div class="adminuser"><div>${safe(u.name||'Без имени')}<small>${safe(u.email||'')}</small><small>${u.role==='admin'?'Администратор':u.blocked?'Заблокирован':'Пользователь'}</small></div>${u.id===currentUser.uid?'<span>Ты</span>':`<button class="${u.blocked?'secondary':'danger'}" data-user="${u.id}" data-block="${u.blocked?'0':'1'}">${u.blocked?'Разблокировать':'Блок'}</button>`}</div>`).join('')}</div>`);$('modalContent').querySelectorAll('[data-user]').forEach(b=>b.onclick=async()=>{try{await setDoc(doc(db,'users',b.dataset.user),{blocked:b.dataset.block==='1'},{merge:true});b.textContent=b.dataset.block==='1'?'Разблокировать':'Блок';b.dataset.block=b.dataset.block==='1'?'0':'1';b.className=b.dataset.block==='1'?'danger':'secondary'}catch(e){alert(e.message)}})}catch(e){alert('Не удалось открыть админку: '+e.message)}};
</script></body></html>
