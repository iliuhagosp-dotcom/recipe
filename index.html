:root{--au1:#12a884;--au2:#325ce4;--au3:#f0b052;--tg-bg:#02070a;--glass:rgb(5 14 14/.72);--hair:rgb(255 255 255/.085);

// Blackgram 5.1: long-press message actions; suppress browser selection/context menu.
(()=>{
 let holdTimer=null,holdTarget=null,holdTriggered=false,startX=0,startY=0;
 const clearHold=()=>{if(holdTimer)clearTimeout(holdTimer);holdTimer=null;holdTarget=null};
 document.addEventListener('contextmenu',e=>{
   const bubble=e.target.closest?.('.bubble[data-id]');
   if(bubble){e.preventDefault();e.stopPropagation();openMsgMenu(bubble.dataset.id)}
 },true);
 document.addEventListener('selectstart',e=>{
   if(!e.target.closest?.('input,textarea,[contenteditable="true"]'))e.preventDefault();
 },true);
 document.addEventListener('pointerdown',e=>{
   const bubble=e.target.closest?.('.bubble[data-id]');
   if(!bubble||e.pointerType==='mouse')return;
   clearHold();holdTarget=bubble;holdTriggered=false;startX=e.clientX;startY=e.clientY;
   holdTimer=setTimeout(()=>{
     if(!holdTarget||!document.body.contains(holdTarget))return;
     holdTriggered=true;
     if(navigator.vibrate)navigator.vibrate(18);
     openMsgMenu(holdTarget.dataset.id);
   },430);
 },{capture:true,passive:true});
 document.addEventListener('pointermove',e=>{
   if(holdTimer&&(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12))clearHold();
 },{capture:true,passive:true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,clearHold,{capture:true,passive:true}));
 document.addEventListener('click',e=>{
   if(holdTriggered){e.preventDefault();e.stopPropagation();holdTriggered=false}
 },true);
})();

// Rebuild the chat list from the full cache so archived chats can be viewed without losing existing pinning/search behavior.
renderChats=function(){
 if(!currentUser)return;
 const original=chatCache,arch=bg5Archived(),blocked=bg5Blocked();
 let filtered=original.filter(c=>!(c.kind==='personal'&&blocked.has((c.participants||[]).find(x=>x!==currentUser.uid))));
 if(bg5ChatFilter==='archive')filtered=filtered.filter(c=>arch.has(c.id));
 else {filtered=filtered.filter(c=>!arch.has(c.id));if(['personal','group','channel'].includes(bg5ChatFilter))filtered=filtered.filter(c=>c.kind===bg5ChatFilter);}
 chatCache=filtered;
 try{bg5OriginalRenderChats()}finally{chatCache=original}
};

 if(audio&&!audio.dataset.bg5Speed){audio.dataset.bg5Speed='1';const row=document.createElement('div');row.className='voice-controls';const btn=document.createElement('button');btn.type='button';btn.className='voice-speed';btn.textContent='1×';btn.onclick=()=>{const speeds=[1,1.5,2,.5],cur=Number(audio.playbackRate)||1,next=speeds[(speeds.indexOf(cur)+1)%speeds.length];audio.playbackRate=next;btn.textContent=next+'×'};row.append(btn);audio.parentElement?.append(row)}
};

  var T={'#tgBurger':'Меню','#tgSearchBtn':'Поиск','#bg5ChatSettings':'Настройки чата','#chatInfo':'Участники','#reportUserBtn':'Пожаловаться','#tgAttach':'Вложения','#tgEmoji':'Эмодзи и стикеры','#tgMic':'Голосовое сообщение','#sendBtn':'Отправить','#backToChats':'Назад'};
  Object.keys(T).forEach(function(k){var el=$q(k);if(el&&!el.getAttribute('data-tip')&&!el.getAttribute('title'))el.setAttribute('data-tip',T[k])});
  var ci=$q('#chatInfo');if(ci&&!ci.querySelector('.bgi')){ci.insertBefore(icon('users'),ci.firstChild)}
  var ta=$q('#tgAttach use');if(ta&&ta.getAttribute('href')==='#bgi-clip')ta.setAttribute('href','#bgi-plus')}
function mountMode(){
  var c=document.getElementById('modalContent');if(!c||document.getElementById('bgMode'))return;var h=c.querySelector('h3');if(!h||!/Оформление/.test(h.textContent))return;
  var box=document.createElement('div');box.id='bgMode';box.innerHTML='<b>'+window.bgIcon('layout','chip sm')+'Стиль чата</b><div class="mm"><div role="button" tabindex="0" class="mb" data-m="tg"><div class="pv tgp"><i></i><i></i><i></i></div><span class="bgm-t">Telegram</span></div><div role="button" tabindex="0" class="mb" data-m="dc"><div class="pv dcp"><s></s><i></i><u></u><i></i></div><span class="bgm-t">Discord</span></div></div>';
  box.querySelectorAll('.mb').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-m')===getMode());b.onclick=function(){setMode(b.getAttribute('data-m'));try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}});
  c.appendChild(box)}
var _rs=0;function railSoon(){if(_rs)return;_rs=requestAnimationFrame(function(){_rs=0;renderRail()})}
function extra(){
  buildArt();
  rail=document.createElement('div');rail.id='bgRail';document.body.appendChild(rail);strip=document.createElement('div');strip.id='bgStrip';
  var top=$q('.sidebar .top');top&&top.parentNode?top.parentNode.insertBefore(strip,top.nextSibling):0;
  rail.addEventListener('click',railClick);strip.addEventListener('click',railClick);
  buildUser();tidy();document.body.classList.toggle('mode-dc',getMode()==='dc');renderRail();
  var ap=document.getElementById('app'),au=document.getElementById('auth');var ob=new MutationObserver(function(){railSoon()});ap&&ob.observe(ap,{attributes:true,attributeFilter:['style','class']});au&&ob.observe(au,{attributes:true,attributeFilter:['style','class']});
  var pp=document.getElementById('people');pp&&new MutationObserver(function(){railSoon()}).observe(pp,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  var ff=document.getElementById('bg5ChatFilters');ff&&new MutationObserver(function(){railSoon()}).observe(ff,{attributes:true,subtree:true,attributeFilter:['class']});
  var me=document.getElementById('me');me&&new MutationObserver(buildUser).observe(me,{childList:true,subtree:true,characterData:true});
  var ms=document.getElementById('messages');var dq=0;ms&&new MutationObserver(function(){if(dq)return;dq=requestAnimationFrame(function(){dq=0;decorate()})}).observe(ms,{childList:true,subtree:true});
  var ct=document.getElementById('chatTitle');ct&&new MutationObserver(function(){if(document.body.classList.contains('mode-dc')){undecorate();decorate()}}).observe(ct,{childList:true,characterData:true,subtree:true});
  decorate()}

function boot(){
  mountSprite();applyAcc(savedAcc());special();scan(document.body);syncLight();extra();
  new MutationObserver(function(recs){
    var sp=false;
    recs.forEach(function(r){
      if(r.type==='characterData'){enqueue(r.target);return}
      r.addedNodes.forEach(function(n){if(n.nodeType===1||n.nodeType===3)enqueue(n)});sp=true});
    if(sp&&!window.__bgSp){window.__bgSp=setTimeout(function(){window.__bgSp=0;special();mountAccent();mountMode();tidy()},150)}
  }).observe(document.body,{childList:true,subtree:true,characterData:true});
  new MutationObserver(syncLight).observe(document.body,{attributes:true,attributeFilter:['class']});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();

</script>
</body></html>
